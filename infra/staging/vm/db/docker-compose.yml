name: template-project-staging-db

services:
  db:
    image: pgvector/pgvector:pg16-bookworm
    container_name: template_web_staging_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-template_web_master}
      POSTGRES_USER: ${POSTGRES_USER:-template_web}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/staging/vm/db/.env}
    ports:
      - "127.0.0.1:${DB_PORT:-32008}:5432"
    volumes:
      - template_web_staging_db_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - template_web_staging
    restart: unless-stopped

volumes:
  template_web_staging_db_data:
    name: template-web-staging-db_template_web_staging_db_data

networks:
  template_web_staging:
    name: template_web_staging
    external: true
