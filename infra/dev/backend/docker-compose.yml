name: template-project-dev-backend

services:
  backend:
    build:
      context: ../../../backend
      dockerfile: Dockerfile
      additional_contexts:
        gomodcache: ${GO_MOD_CACHE_CONTEXT:-/home/yudi/go/pkg/mod/cache/download}
    image: template-project-backend:dev
    container_name: template-project-backend-dev
    environment:
      PORT: 8080
      CORS_ALLOW_ORIGIN: ${BACKEND_CORS_ALLOW_ORIGIN:-http://localhost:31006}
      MASTER_DB_DSN: ${MASTER_DB_DSN:?Set MASTER_DB_DSN in infra/dev/backend/.env}
      TR_DB_DSN: ${TR_DB_DSN:?Set TR_DB_DSN in infra/dev/backend/.env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-POS Kasir Service}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
    ports:
      - "${BACKEND_PORT:-31007}:8080"
    restart: unless-stopped
    networks:
      - template_project_dev

networks:
  template_project_dev:
    name: template_project_dev
    external: true
