name: template-project-dev-db

services:
  db:
    image: pgvector/pgvector:pg16-bookworm
    container_name: template_project_dev_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-template_project_master}
      POSTGRES_USER: ${POSTGRES_USER:-template_project}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/dev/db/.env}
    ports:
      - "127.0.0.1:${DB_PORT:-31008}:5432"
    volumes:
      - template_project_dev_db_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - template_project_dev
    restart: unless-stopped

volumes:
  template_project_dev_db_data:
    name: template-project-dev-db_template_project_dev_db_data

networks:
  template_project_dev:
    name: template_project_dev
    external: true
