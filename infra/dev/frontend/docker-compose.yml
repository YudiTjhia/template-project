name: template-project-dev-frontend

services:
  frontend:
    build:
      context: ../../../frontend/web
      dockerfile: Dockerfile
      args:
        SUB_APP_TYPE: ${SUB_APP_TYPE:-admin}
        APP_NAME: ${APP_NAME:-Application}
        NEXT_PUBLIC_ACCOUNT_REGISTER_PATH: ${NEXT_PUBLIC_ACCOUNT_REGISTER_PATH:-/auth/accounts/register}
        NEXT_PUBLIC_LOGIN_PATH: ${NEXT_PUBLIC_LOGIN_PATH:-/auth/login}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${NEXT_PUBLIC_FIREBASE_VAPID_KEY:-}
    image: template-project:dev
    container_name: template-project-frontend-dev
    environment:
      NODE_ENV: production
      APP_NAME: ${APP_NAME:-Application}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://host.docker.internal:31017}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONTEND_PORT:-31006}:3000"
    restart: unless-stopped
